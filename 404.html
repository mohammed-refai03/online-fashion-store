<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly Fashion Boutique</title>
  <meta name="description" content="The boutique page or collection you are seeking has moved or no longer exists. Return home or browse our curated fashion collections.">

  <!-- FontAwesome 6 (Strict Rule: FontAwesome ONLY, no emojis, no svg) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    /* Full Viewport Clean 404 Layout (Navbar Removed & Perfectly Aligned) */
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: radial-gradient(circle at center, #FFFFFF 0%, #F5EFEB 100%);
    }

    .error-viewport {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      box-sizing: border-box;
    }

    /* Ambient Pulsing Background Glow */
    .anim-glow-circle {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 163, 115, 0.28) 0%, rgba(212, 163, 115, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    .error-container {
      position: relative;
      z-index: 2;
      max-width: 680px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Brand Watermark Emblem */
    .error-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      text-decoration: none;
    }

    .error-brand-emblem {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--color-primary);
      color: var(--color-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border: 1px solid var(--color-gold);
      box-shadow: 0 4px 12px rgba(43, 24, 16, 0.15);
    }

    .error-brand-name {
      font-family: var(--font-heading);
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--color-primary);
    }

    .error-brand-name span {
      color: var(--color-accent);
    }

    /* Tag Badge placed properly above 404 */
    .error-tag-wrap {
      margin-bottom: 18px;
    }

    .error-tag-wrap .section-tag {
      margin-bottom: 0;
      font-size: 0.85rem;
      letter-spacing: 2px;
      padding: 7px 20px;
    }

    /* 404 Visual Number Display with Dedicated Negative-Margin Free Positioning */
    .error-visual-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 22px;
      padding: 10px 48px;
    }

    .anim-404-number {
      font-family: var(--font-heading);
      font-size: 8.8rem;
      font-weight: 700;
      line-height: 1;
      color: var(--color-primary);
      letter-spacing: -2px;
      text-shadow: 0 12px 32px rgba(43, 24, 16, 0.12);
      margin: 0;
      user-select: none;
    }

    .anim-404-number span {
      color: var(--color-accent);
    }

    /* Floating boutique decorative icons - Properly aligned outside text boundaries */
    .anim-floating-hanger {
      position: absolute;
      top: -10px;
      left: 6px;
      font-size: 2.8rem;
      color: var(--color-gold);
      filter: drop-shadow(0 8px 18px rgba(43, 24, 16, 0.16));
    }

    .anim-floating-bag {
      position: absolute;
      bottom: -4px;
      right: 6px;
      font-size: 2.8rem;
      color: var(--color-accent);
      filter: drop-shadow(0 8px 18px rgba(43, 24, 16, 0.16));
    }

    .error-title {
      font-size: 2.4rem;
      color: var(--color-primary);
      margin-bottom: 14px;
      line-height: 1.2;
    }

    .error-desc {
      font-size: 1.05rem;
      color: var(--color-text-muted);
      line-height: 1.65;
      margin-bottom: 34px;
      max-width: 540px;
    }

    /* Action Buttons Row */
    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .error-actions .btn {
      min-width: 175px;
      padding: 14px 28px;
      font-size: 0.95rem;
    }

    /* Minimal Bottom Footer */
    .error-bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--color-text-light);
      z-index: 2;
    }

    /* Responsive Tuning */
    @media (max-width: 575px) {
      .anim-404-number {
        font-size: 5.6rem;
      }
      .error-visual-container {
        padding: 10px 30px;
      }
      .anim-floating-hanger, .anim-floating-bag {
        font-size: 2.1rem;
      }
      .anim-floating-hanger { left: 0; top: -6px; }
      .anim-floating-bag { right: 0; bottom: -2px; }
      .error-title {
        font-size: 1.8rem;
      }
      .error-desc {
        font-size: 0.94rem;
      }
      .error-actions {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
      }
      .error-actions .btn {
        width: 100%;
      }
    }

    @media (max-width: 330px) {
      .anim-404-number {
        font-size: 4.4rem;
      }
      .error-title {
        font-size: 1.55rem;
      }
    }
  </style>
</head>
<body>

  <div class="error-viewport">
    
    <!-- Ambient Radial Glow -->
    <div class="anim-glow-circle"></div>

    <div class="error-container">
      
      <!-- Brand Emblem Anchor -->
      <a href="index.html" class="error-brand-badge" title="Stackly Home">
        <img src="images/logo.webp" alt="Stackly Fashion Boutique" class="brand-logo-img" style="height: 48px; max-width: 190px;">
      </a>

      <!-- Clean Properly Positioned Tag Badge -->
      <div class="error-tag-wrap">
        <span class="section-tag">
          <i class="fa-solid fa-compass"></i> Lost on the Runway
        </span>
      </div>

      <!-- Properly Aligned 404 Typography & Floating Fashion Elements -->
      <div class="error-visual-container">
        <!-- Floating Fashion Garment -->
        <div class="anim-floating-hanger">
          <i class="fa-solid fa-shirt"></i>
        </div>

        <h1 class="anim-404-number">4<span>0</span>4</h1>

        <!-- Floating Designer Handbag -->
        <div class="anim-floating-bag">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
      </div>

      <!-- Headline -->
      <h2 class="error-title">Page Not Found in Our Collection</h2>
      
      <!-- Description -->
      <p class="error-desc">
        The couture ensemble or link you are searching for is currently unavailable or has been archived into our previous season.
      </p>

      <!-- Mandatory 2 Buttons: Return to Home and Go Back -->
      <div class="error-actions">
        <!-- Button 1: Return to Home -->
        <a href="index.html" class="btn btn-primary btn-pill">
          <i class="fa-solid fa-house"></i> Return to Home
        </a>

        <!-- Button 2: Go Back to Previous Page -->
        <button type="button" onclick="window.history.back()" class="btn btn-outline btn-pill">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </button>
      </div>

    </div>

    <!-- Minimal Subtle Bottom Copyright -->
    <div class="error-bottom-bar">
      &copy; 2026 Stackly Online Fashion Boutique | Salem, Tamil Nadu
    </div>

  </div>

  <!-- GSAP Library for Smooth Continuous Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Error 404 Animation Script -->
  <script src="js/error404.js"></script>
</body>
</html>
